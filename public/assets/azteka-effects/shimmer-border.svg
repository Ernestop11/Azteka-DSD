<svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="35%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <filter id="softGlow" x="-50" y="-50" width="900" height="340" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="15" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="784" height="224" rx="40" stroke="url(#borderGradient)" stroke-width="8" filter="url(#softGlow)" fill="transparent" />
</svg>
